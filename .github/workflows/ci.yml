name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A single Linux job: the expensive per-platform failures are bundling and
    # signing, which only a tagged release can meaningfully exercise anyway.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libdbus-1-dev librsvg2-dev libssl-dev \
            build-essential pkg-config patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Frontend
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build

      - name: Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib

      # Cheap smoke test that the sidecar actually loads libvips on this
      # platform, without paying for a full bundle.
      - name: Sidecar smoke test
        run: |
          node scripts/build-sidecar.mjs
          printf '{"op":"versions","id":"1"}\n' \
            | node src-tauri/resources/sidecar/index.cjs \
            | tee /dev/stderr \
            | grep -q '"ok":true'
