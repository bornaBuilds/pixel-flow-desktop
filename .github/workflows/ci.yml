name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A single Linux job: the expensive per-platform failures are bundling and
    # signing, which only a tagged release can meaningfully exercise anyway.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libdbus-1-dev librsvg2-dev libssl-dev \
            build-essential pkg-config patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Catches the three version fields drifting apart in a normal commit.
      - name: Version consistency
        run: node scripts/set-version.mjs --check

      - name: Frontend
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build

      # tauri_build validates BOTH bundle.externalBin and bundle.resources, so
      # every cargo invocation - clippy and test included - fails without them.
      # Both are gitignored.
      #
      # The ~100 MB Node runtime is not worth downloading on every PR: this job
      # never spawns the sidecar through Tauri, and the smoke test below runs it
      # under the runner's own node. A placeholder satisfies the check.
      - name: Stub the sidecar binary (checks only, never executed)
        run: |
          mkdir -p src-tauri/binaries
          TRIPLE=$(rustc --print host-tuple)
          printf '#!/bin/sh\necho "placeholder - CI checks do not run the sidecar" >&2\nexit 1\n' \
            > "src-tauri/binaries/pixelflow-node-$TRIPLE"
          chmod +x "src-tauri/binaries/pixelflow-node-$TRIPLE"

      # The resource tree is built for real: it is cheap (no runtime download),
      # tauri_build requires it to exist, and the smoke test needs it anyway.
      - name: Build sidecar tree
        run: node scripts/build-sidecar.mjs

      # Fails fast and cheaply if sharp cannot load libvips on this platform.
      - name: Sidecar smoke test
        run: |
          printf '{"op":"versions","id":"1"}\n' \
            | node src-tauri/resources/sidecar/index.cjs \
            | tee /dev/stderr \
            | grep -q '"ok":true'

      - name: Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
