name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# macOS is intentionally absent for now. The Rust and sidecar work is
# platform-agnostic and scripts/sign-macos-inner.sh is kept, so re-adding it is
# a matrix entry plus the certificate steps - see README.
jobs:
  build:
    name: ${{ matrix.label }}
    permissions:
      contents: write
    strategy:
      # One platform failing should not hide whether the other works.
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04, not -latest: the glibc a binary is built against is a
          # floor, so building on 24.04 would refuse to run on 22.04/Debian 12.
          # Deprecation starts 2026-09-17 and completes 2027-04-17; when it goes,
          # move to `container: ubuntu:22.04` on ubuntu-latest rather than
          # bumping the runner.
          - label: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--bundles deb,rpm,appimage"
          - label: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            # NSIS only: the updater path is far better tested for NSIS than MSI.
            args: "--bundles nsis"

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libdbus-1-dev librsvg2-dev libssl-dev \
            build-essential pkg-config patchelf xdg-utils file

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      # ~100 MB Node runtime + the target's sharp/libvips. Neither is in git.
      #
      # bash on every platform, including Windows: `run:` defaults to pwsh
      # there, where a failing first line does not stop the second and the
      # original error gets masked.
      - name: Prepare sidecar
        shell: bash
        run: |
          set -euxo pipefail
          node --version
          node scripts/fetch-node.mjs ${{ matrix.target }}
          node scripts/build-sidecar.mjs ${{ matrix.target }}
          ls -la src-tauri/binaries/
          ls src-tauri/resources/sidecar/node_modules/@img/

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "PixelFlow __VERSION__"
          releaseDraft: true
          prerelease: false
          # No updater configured yet (Milestone 5); the default would publish a
          # latest.json nothing can consume.
          uploadUpdaterJson: false
          args: ${{ matrix.args }} --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: pixelflow-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
