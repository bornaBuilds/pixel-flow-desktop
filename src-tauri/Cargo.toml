[package]
name = "pixel-flow-desktop"
version = "0.1.0"
description = "Convert images and pull thumbnails out of video. Offline."
authors = ["bornaBuilds"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pixel_flow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-opener = "2.5"
tauri-plugin-log = "2"
# Phase 2: spawning the Node + sharp sidecar
tauri-plugin-shell = "2.3"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
